<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-bleed canvas game with DOM overlays for the opening screen and dialogs.
   Look: night-city asphalt, sodium-amber accent, siren-red for danger. Single dark theme by design. */
:root{
  --bg:#120a20; --ink:#eef2f7; --dim:#b9a6d6; --amber:#ff4fa8; --hot:#ff3d5a;--cyan:#27e6e0; --ok:#3ddc84;
  --panel:rgba(11,15,22,.9); --line:rgba(255,255,255,.16);
  --disp:'Russo One','Arial Black',Impact,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html{overscroll-behavior:none}
#rot{position:fixed;inset:0;z-index:50;background:#120a20;color:#eef2f7;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font:400 22px 'Russo One',Impact,sans-serif;letter-spacing:.05em}
#rot .ph{width:46px;height:78px;border:4px solid #ff4fa8;border-radius:10px;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
#gl,#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{background:var(--bg)}
.hide{display:none!important}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;
  background:radial-gradient(ellipse at 50% 45%,rgba(30,8,50,.1) 0%,rgba(20,6,40,.7) 78%),linear-gradient(rgba(255,90,160,.14),rgba(40,10,90,.3))}
#menu h1{margin:0;font:400 clamp(44px,13vw,110px)/.95 var(--disp);letter-spacing:.04em;color:#fff;transform:skewX(-8deg);text-shadow:0 0 6px var(--cyan),0 0 26px rgba(39,230,224,.7),0 4px 0 #0b5b6b;animation:flick 5s infinite}
#menu h1 span{color:var(--amber);text-shadow:0 0 6px #ff4fa8,0 0 28px rgba(255,79,168,.8),0 4px 0 #5a0f66}
#menu .tag{margin:0 0 14px;color:var(--dim);letter-spacing:.28em;text-transform:uppercase;font-size:12px}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
.btn{font:400 18px var(--disp);letter-spacing:.06em;color:#10131a;background:var(--amber);border:0;border-radius:6px;padding:13px 0;width:min(280px,80vw);cursor:pointer;box-shadow:0 4px 0 #7a1d63;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a1d63}
.btn.alt{background:#232a38;color:var(--ink);box-shadow:0 4px 0 #0c0f16;border:1px solid var(--line)}
.btn.alt:active{box-shadow:0 1px 0 #0c0f16}
#menu .foot{margin-top:10px;color:var(--dim);font-size:12px;max-width:34em}
#help{max-width:520px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:13.5px;line-height:1.55}
#help b{color:var(--amber)}
#help p{margin:.2em 0}
#dlg{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#dTitle{font:400 20px var(--disp);color:var(--amber);letter-spacing:.04em;margin-bottom:4px}
#dText{color:var(--ink);font-size:15px;line-height:1.5;margin-bottom:12px}
#dText small{color:var(--dim)}
#dBtns{display:flex;gap:8px;flex-wrap:wrap}
#dBtns button{flex:1 1 120px;font:400 15px var(--disp);letter-spacing:.04em;border-radius:6px;border:1px solid var(--line);padding:11px 10px;cursor:pointer;background:#232a38;color:var(--ink)}
#dBtns button:first-child{background:var(--amber);color:#10131a;border-color:transparent}
.card,.sheet{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.6);touch-action:pan-y;overflow:auto;z-index:6}
.card{left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
.sheet{left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:min(430px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
.ttl{font:400 20px var(--disp);color:var(--amber);letter-spacing:.05em;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.ttl .cash{color:var(--ok);font-size:18px}
.sec{margin:12px 0 6px;font:700 12px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.sec small{text-transform:none;letter-spacing:0;font-weight:500;color:#7f8ba0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row .lab{font-size:14px}.row .lab small{display:block;color:var(--dim);font-size:11.5px}
.ops{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opt{font:700 13px system-ui;color:var(--ink);background:#232a38;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;min-width:44px}
.opt.on{background:var(--amber);color:#10131a;border-color:transparent}
.opt.key{min-width:92px;font-family:ui-monospace,Menlo,Consolas,monospace}
.opt.done{background:var(--amber);color:#10131a;border-color:transparent;font-family:var(--disp);letter-spacing:.05em;padding:10px 22px}
.val{min-width:40px;text-align:center;font-weight:700}
.foot2{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;color:#ccc;font-size:16px;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--amber)}
#mapw{position:fixed;inset:0;z-index:7;background:rgba(10,6,24,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;touch-action:none}
#mapcv{border-radius:14px;border:2px solid rgba(255,255,255,.3);box-shadow:0 10px 50px rgba(0,0,0,.6)}
#mapbar{display:flex;gap:8px;align-items:center}
#maplg{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:11.5px;color:var(--dim);max-width:92vw}
#maplg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;border:1px solid #000}
#avpv{display:block;margin:4px auto 6px;background:rgba(255,255,255,.06);border-radius:10px}
</style>

<div id="dlg" class="hide">
  <div id="dTitle"></div>

</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let VW=1,VH=1,DPR=1,GLQ=1.5;
const SA={l:0,r:0,t:0,b:0};
function readSA(){const d=document.createElement('div');d.style.cssText='position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';document.body.appendChild(d);const c=getComputedStyle(d);SA.t=parseFloat(c.paddingTop)||0;SA.r=parseFloat(c.paddingRight)||0;SA.b=parseFloat(c.paddingBottom)||0;SA.l=parseFloat(c.paddingLeft)||0;d.remove();}
addEventListener('resize',readSA);addEventListener('orientationchange',()=>setTimeout(readSA,300));window.addEventListener('load',readSA);
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);VW=window.innerWidth;VH=window.innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);const g=document.getElementById('gl'),q=Math.min(window.devicePixelRatio||1,GLQ);g.width=Math.round(VW*q);g.height=Math.round(VH*q);}
window.addEventListener('resize',resize);resize();

const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function darken(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return'rgb('+r+','+g+','+b+')';}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ================= WORLD ================= */
const ROAD=150,BLK=290,CELL=ROAD+BLK,N=10,WORLD=N*CELL+ROAD,SWK=18,LANE=ROAD/4;
const rc=i=>i*CELL+ROAD/2;
const SPECIAL={'4,3':'hospital','3,6':'garage','6,4':'ammu','7,7':'bank'};
const SPCOL={hospital:'#dfe7f0',garage:'#6b7280',ammu:'#7d3a3a',bank:'#b9a35c'};
const SPLBL={hospital:'HOSPITAL',garage:'GARAGE',ammu:'GUN SHOP',bank:'CITY BANK'};
const PAL=['#f6a5c8','#8fe3d9','#ffd0a0','#c3a6f0','#f4f1e6','#ff9fa8','#9fd8f5','#fff0a8','#a8f0c0'];
const blocks=[];
(function genWorld(){
  const wr=mulberry(20261107);
  for(let i=0;i<N;i++){blocks[i]=[];for(let j=0;j<N;j++){
    const b={i,j,x:i*CELL+ROAD,y:j*CELL+ROAD,kind:'city',bl:[],trees:[]};
    const sp=SPECIAL[i+','+j];
    const x=b.x+SWK,y=b.y+SWK,s=BLK-2*SWK;
    const add=(bx,by,bw,bh,col,spk)=>{const ins=spk?10:wr()*5;const c=col||PAL[(wr()*PAL.length)|0];
      b.bl.push({x:bx+ins,y:by+ins,w:bw-2*ins,h:bh-2*ins,c,cd:darken(c,-38),k:wr(),sp:spk});};
    const inner=(i>=4&&i<=6&&j>=4&&j<=6);
    if(sp){b.kind=sp;add(x,y,s,s,SPCOL[sp],sp);}
    else if(wr()<0.15&&!inner){b.kind='park';for(let t=0;t<11;t++)b.trees.push({x:b.x+SWK+14+wr()*(s-28),y:b.y+SWK+14+wr()*(s-28),r:10+wr()*9,c:wr()});}
    else{const L=wr(),g=10;
      if(L<.3)add(x,y,s,s);
      else if(L<.55){const w=(s-g)/2;add(x,y,w,s);add(x+w+g,y,w,s);}
      else if(L<.8){const h=(s-g)/2;add(x,y,s,h);add(x,y+h+g,s,h);}
      else{const w=(s-g)/2;add(x,y,w,w);add(x+w+g,y,w,w);add(x,y+w+g,w,w);add(x+w+g,y+w+g,w,w);}
    }
    blocks[i][j]=b;
  }}
})();
function sw(i,j,side,t){const b=blocks[i][j],m=9;
  if(side===0)return{x:b.x+t*BLK,y:b.y+m};
  if(side===1)return{x:b.x+BLK-m,y:b.y+t*BLK};
  if(side===2)return{x:b.x+t*BLK,y:b.y+BLK-m};
  return{x:b.x+m,y:b.y+t*BLK};}

function circRect(o,r,b){
  const cx=clamp(o.x,b.x,b.x+b.w),cy=clamp(o.y,b.y,b.y+b.h);
  const dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy;
  if(d2>=r*r)return false;
  if(d2<1e-6){const l=o.x-b.x,rt=b.x+b.w-o.x,t=o.y-b.y,bt=b.y+b.h-o.y,m=Math.min(l,rt,t,bt);
    if(m===l)o.x=b.x-r;else if(m===rt)o.x=b.x+b.w+r;else if(m===t)o.y=b.y-r;else o.y=b.y+b.h+r;return true;}
  const d=Math.sqrt(d2);o.x=cx+dx/d*r;o.y=cy+dy/d*r;return true;
}
function bRange(v,r){return[clamp(Math.floor((v-r-ROAD)/CELL),0,N-1),clamp(Math.floor((v+r-ROAD)/CELL),0,N-1)];}
function hitWorld(o,r){
  o.x=clamp(o.x,r,WORLD-r);o.y=clamp(o.y,r,WORLD-r);
  let hit=false;const[i0,i1]=bRange(o.x,r),[j0,j1]=bRange(o.y,r);
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const b=blocks[i][j];if(b.kind==='park')continue;
    for(const q of b.bl){if(circRect(o,r,q))hit=true;}}
  return hit;
}
function blockedAt(x,y,r){return hitWorld({x,y},r);}
function inBuilding(x,y){
  if(x<0||y<0||x>WORLD||y>WORLD)return true;
  const[i0,i1]=bRange(x,0),[j0,j1]=bRange(y,0);
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const b=blocks[i][j];if(b.kind==='park')continue;
    for(const q of b.bl)if(x>q.x&&x<q.x+q.w&&y>q.y&&y<q.y+q.h)return true;}
  return false;
}
function pushCircle(o,r,cx,cy,cr){const dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy),m=r+cr;if(d<m&&d>0.001){o.x=cx+dx/d*m;o.y=cy+dy/d*m;return true;}return false;}

/* minimap raster */
const MS=0.16,mini=document.createElement('canvas');mini.width=mini.height=Math.ceil(WORLD*MS);
(function(){const m=mini.getContext('2d');m.fillStyle='#d6d9e4';m.fillRect(0,0,mini.width,mini.height);m.scale(MS,MS);
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const b=blocks[i][j];
    m.fillStyle=b.kind==='park'?'#49b36a':'#6f8fc9';m.fillRect(b.x,b.y,BLK,BLK);
    for(const q of b.bl){m.fillStyle=q.sp?q.c:'#4f6fab';m.fillRect(q.x,q.y,q.w,q.h);}}
})();

/* ================= SETTINGS ================= */
const SET={cam:'chase',time:'dusk',quality:'high',steer:'stick',sens:1,assist:true};
const BIND={up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',act:'Enter',swap:'NumpadAdd',hb:'Space',fire:'Numpad0',cam:'KeyV',radio:'KeyR'};
const BIND_DEF=Object.assign({},BIND);
let custCar=null;
const AV={skin:'#f1c9a5',shirt:'#2b9d8a',pants:'#243567',hair:'#2a1d12',hat:0,hatc:'#ff5fa8',shades:false};
function saveAv(){try{localStorage.setItem('portcity_av',JSON.stringify(AV));}catch(e){}}
(function(){try{const d=JSON.parse(localStorage.getItem('portcity_av')||'null');if(d)Object.assign(AV,d);}catch(e){}})();
/* ================= STATE ================= */
const WEAP=[
  {n:'Pistol',rate:.32,dmg:26,spd:15,spread:.03,pel:1,mag:'PISTOL'},
  {n:'SMG',rate:.085,dmg:12,spd:16.5,spread:.1,pel:1,mag:'SMG'},
  {n:'Shotgun',rate:.85,dmg:14,spd:14.5,spread:.2,pel:7,mag:'SHOTGUN'}];
const CARCOL=['#ff4fa0','#2ee6d6','#f5f0e6','#ffd24a','#7a5cff','#ff7a4f','#4f8fd9','#2f3441','#e8e8e8','#3ddc84'];
const SHIRT=['#ff5fa8','#27e6e0','#ffd54f','#ff8a50','#f5f0e6','#b388ff','#7cf0a0','#ff6f6f','#58c8ff','#f06292'];
const SKIN=['#f1c9a5','#d9a679','#a8744f','#7a4a2d','#f5d7b8'];
const DX=[1,0,-1,0],DY=[0,1,0,-1];

let state='menu',prevState='menu',gt=0,shake=0,deadT=0;
const P={x:0,y:0,a:0,hp:100,money:0,w:0,has:[true,false,false],ammo:[30,0,0],car:null,cd:0,step:0,hurt:0,moveA:null};
const cam={x:rc(4),y:rc(4),z:1};
const F={x:0,y:0};
let peds=[],cars=[],bullets=[],parts=[],pickups=[],decals=[],toasts=[],banners=[];
let heat=0,heatQuiet=0,wanted=0,spawnCarT=0,spawnPedT=0,spawnCopT=0;
const M={idx:0,active:false,stage:0,obj:'',target:null,timer:0,tmax:0,left:0,tcar:null,gang:[]};

/* ================= ENTITIES ================= */
function mkPed(x,y,type,o){o=o||{};
  const p={x,y,a:rand(0,TAU),type,hp:type==='civ'?40:type==='cop'?70:type==='gang'?60:999,col:o.col||pick(SHIRT),skin:pick(SKIN),
    t:rand(.5,3),idle:0,flee:0,fx:0,fy:0,fire:rand(.3,1.2),dead:false,dt:0,step:rand(0,6),seed:rand(0,9),alert:false,det:520,sd:Math.random()<.5?1:-1,leave:0,m:false,name:o.name||''};
  peds.push(p);return p;}
function mkCar(x,y,a,kind,o){o=o||{};
  const c={x,y,a,spd:0,kind,col:o.col||pick(CARCOL),hp:100,maxSpd:o.maxSpd||5.7,acc:o.acc||.15,dir:0,node:-1,burn:0,wt:0,locked:!!o.locked,sport:!!o.sport,tgt:!!o.tgt,fast:!!o.fast,stuck:0,ghost:0,lim:o.lim||rand(2.6,3.4),shape:o.shape||(o.sport?'sport':pick(['sedan','sedan','sport','van'])),rim:'#c9ced6',neon:null,spoiler:false,eng:0,mine:false};
  cars.push(c);return c;}
function carCircles(c){const cx=Math.cos(c.a)*13,cy=Math.sin(c.a)*13;return[[c.x+cx,c.y+cy],[c.x-cx,c.y-cy]];}
function addPickup(x,y,type,o){pickups.push(Object.assign({x,y,type,cd:0,v:0,drop:false},o||{}));}

function genStatic(){
  cars=[];peds=[];pickups=[];
  const wr=mulberry(777);
  // parked cars on road edges
  for(let j=0;j<=N;j++)for(let i=0;i<N;i++){ // horizontal roads
    if(wr()<.45){const x=i*CELL+ROAD+40+wr()*(BLK-80),side=wr()<.5?1:-1;
      mkCar(x,rc(j)+side*(ROAD/2-15),side>0?0:Math.PI,'parked',{col:CARCOL[(wr()*CARCOL.length)|0]});}}

/* ================= AUDIO ================= */
let AC=null,muted=false,nbuf=null,eng=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=60;f.type='lowpass';f.frequency.value=380;g.gain.value=0;o.connect(f).connect(g).connect(AC.destination);o.start();eng={o,g};
  }catch(e){AC=null;}
}
function tone(f,d,type,v,sl){if(!AC||muted)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,v,fc){if(!AC||muted)return;try{if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const s=AC.createBufferSource();s.buffer=nbuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||2500;const g=AC.createGain(),t=AC.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+d+.02);}catch(e){}}
function sfx(n,dist){const v=dist==null?1:clamp(1-dist/800,0,1);if(v<.03)return;
  switch(n){
    case'shot':noise(.09,.18*v,3500);tone(160,.08,'sawtooth',.05*v,-90);break;
    case'smg':noise(.06,.13*v,4200);break;
    case'shotgun':noise(.28,.3*v,2200);tone(90,.2,'sawtooth',.08*v,-50);break;
    case'boom':noise(.8,.4*v,900);tone(70,.6,'sawtooth',.14*v,-45);break;
    case'hit':tone(120,.08,'square',.06*v,-50);break;
    case'hurt':tone(200,.14,'sawtooth',.08,-120);break;
    case'pick':tone(880,.08,'square',.05);setTimeout(()=>tone(1320,.1,'square',.05),70);break;
    case'door':noise(.05,.08,1200);tone(220,.06,'square',.04);break;
    case'ok':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.16,'square',.06),i*110));break;
    case'fail':[300,240,180].forEach((f,i)=>setTimeout(()=>tone(f,.22,'sawtooth',.07),i*160));break;
    case'horn':tone(330,.28,'square',.07);tone(415,.28,'square',.06);break;
    case'click':tone(90,.04,'square',.04);break;}}

function blast(x,y,r){
  fx(x,y,26,'#ff4fa8',6,.7,9,.3);fx(x,y,18,'#ff5030',4,.8,12,.4);fx(x,y,14,'#333',3,1.4,14,.5);

/* ================= CARS ================= */
function carWorld(c){
  for(const s of[1,-1]){const o={x:c.x+Math.cos(c.a)*13*s,y:c.y+Math.sin(c.a)*13*s},ox=o.x,oy=o.y;
    if(hitWorld(o,13)){c.x+=o.x-ox;c.y+=o.y-oy;return true;}}
  return false;
}
function carCar(a,b){
  if(Math.abs(a.x-b.x)>60||Math.abs(a.y-b.y)>60)return false;
  let hit=false;
  for(const p of carCircles(a))for(const q of carCircles(b)){
    const dx=q[0]-p[0],dy=q[1]-p[1],d=Math.hypot(dx,dy),m=26;
    if(d<m&&d>.01){const pen=(m-d),nx=dx/d,ny=dy/d;
      const bStatic=(b.kind==='parked'||b.kind==='wreck')&&Math.abs(b.spd)<.2;
      if(bStatic){a.x-=nx*pen*.6;a.y-=ny*pen*.6;}else{a.x-=nx*pen*.3;a.y-=ny*pen*.3;b.x+=nx*pen*.3;b.y+=ny*pen*.3;}
      hit=true;}}
  if(hit){const rel=Math.abs(a.spd)+Math.abs(b.spd);
    if(rel>2.2){const dmg=(rel-2)*5;
      if(a.kind==='player'||a.tgt)a.hp-=dmg;if(b.kind!=='parked'||true)b.hp-=dmg*(a.kind==='player'?1.4:.5);
      fx((a.x+b.x)/2,(a.y+b.y)/2,4,'#ffd37a',2.5,.25,2);shake=Math.max(shake,3);sfx('hit',Math.hypot(a.x-F.x,a.y-F.y));
      if(b.kind==='ai'&&a.kind==='player')crime(.05);}
    a.spd*=.6;if(b.kind==='ai'||b.kind==='parked')b.spd*=.7;}
  return hit;
}
function updAI(c,dt,k){
  const lx=Math.cos(c.a),ly=Math.sin(c.a);
  let blocked=false;
  const chk=(o,r,reach)=>{const dx=o.x-c.x,dy=o.y-c.y;if(Math.abs(dx)>reach+30||Math.abs(dy)>reach+30)return false;const f=dx*lx+dy*ly;if(f<8||f>reach)return false;return Math.abs(-dx*ly+dy*lx)<r;};
  if(c.ghost>0)c.ghost-=dt;
  else{const reach=64+c.spd*14;
    for(const o of cars){if(o===c||o.kind==='parked'&&Math.abs(o.spd)<.2&&!o.rolling)continue;if(chk(o,24,reach)){blocked=true;break;}}
    if(!blocked){for(const p of peds){if(!p.dead&&chk(p,20,reach)){blocked=true;break;}}}
    if(!blocked&&state==='play'&&!P.car&&chk(P,20,reach))blocked=true;
  }
  const want=blocked?0:(c.fast?4.9:c.lim);
  c.spd+=clamp(want-c.spd,-.3*k,.07*k);
  if(blocked&&c.spd<.1){c.stuck+=dt;if(c.stuck>3){c.ghost=1.6;c.stuck=0;}}else if(!blocked)c.stuck=0;
  const horiz=(c.dir===0||c.dir===2);
  const pos=horiz?c.x:c.y,ni=Math.round((pos-ROAD/2)/CELL),nc=rc(ni);
  const oi=Math.round(((horiz?c.y:c.x)-ROAD/2)/CELL),id=horiz?ni*100+oi:oi*100+ni;
  if(Math.abs(pos-nc)<Math.max(2.5,c.spd*k)&&c.node!==id){
    c.node=id;
    const opts=[];const tryDir=(d,w)=>{const nx=(horiz?ni:oi)+DX[d],ny=(horiz?oi:ni)+DY[d];
      // node coordinates: x-index = horiz?ni:oi ; y-index = horiz?oi:ni
      if(nx>=0&&nx<=N&&ny>=0&&ny<=N)opts.push([d,w]);};
    tryDir(c.dir,.62);tryDir((c.dir+1)%4,.19);tryDir((c.dir+3)%4,.19);
    let tot=0;for(const o of opts)tot+=o[1];let r=Math.random()*tot,d=c.dir;
    for(const o of opts){r-=o[1];if(r<=0){d=o[0];break;}}
    if(!opts.length)d=(c.dir+2)%4;
    c.dir=d;
  }
  // advance along axis & settle into lane
  c.x+=DX[c.dir]*c.spd*k;c.y+=DY[c.dir]*c.spd*k;
  const hz=(c.dir===0||c.dir===2);
  const lane=hz?Math.round((c.y-ROAD/2)/CELL):Math.round((c.x-ROAD/2)/CELL);
  const cl=rc(clamp(lane,0,N));
  if(c.dir===0)c.y+=(cl+LANE-c.y)*Math.min(1,.1*k);
  else if(c.dir===2)c.y+=(cl-LANE-c.y)*Math.min(1,.1*k);
  else if(c.dir===1)c.x+=(cl-LANE-c.x)*Math.min(1,.1*k);
  else c.x+=(cl+LANE-c.x)*Math.min(1,.1*k);
  c.a+=angDiff(c.a,c.dir*Math.PI/2)*Math.min(1,.14*k);
  if(c.x<30||c.y<30||c.x>WORLD-30||c.y>WORLD-30){c.dir=(c.dir+2)%4;}
}
function updPlayerCar(I,dt,k){
  const c=P.car;let thr=I.thr,steer=I.steer;
  if(I.tdrive){const diff=angDiff(c.a,I.sa);steer=clamp(diff*2.6*SET.sens,-1,1);thr=I.sm>.22?1:0;}
  if(!I.tdrive)steer=clamp(steer*SET.sens,-1,1);
  if(I.brake)thr=-1;
  const maxR=2.4,maxF=c.maxSpd*(c.hp<25?.75:1);
  if(thr>0)c.spd+=thr*c.acc*k*(c.spd<0?2.5:1);
  else if(thr<0)c.spd+=thr*(c.spd>0?c.acc*2.6:c.acc*.7)*k;
  else c.spd*=Math.pow(.985,k);
  if(I.hb)c.spd*=Math.pow(.95,k);
  c.spd*=Math.pow(.9975,k);
  c.spd=clamp(c.spd,-maxR,maxF);
  const sf=Math.min(1,Math.abs(c.spd)/2.4)*(1-.3*Math.abs(c.spd)/c.maxSpd);
  c.a+=steer*.058*sf*(c.spd>=0?1:-1)*k*(I.hb?1.5:1);
  c.x+=Math.cos(c.a)*c.spd*k;c.y+=Math.sin(c.a)*c.spd*k;
  if(carWorld(c)){const imp=Math.abs(c.spd);if(imp>1.8){c.hp-=(imp-1.6)*5;shake=Math.max(shake,imp*.9);fx(c.x,c.y,5,'#ffd37a',2.5,.25,2);sfx('hit',0);}c.spd*=-.28;}
  for(const o of cars){if(o!==c)carCar(c,o);}
  if(Math.abs(c.spd)>1.8){
    for(const p of peds){if(p.dead||p.type==='npc')continue;if(Math.abs(p.x-c.x)<34&&Math.abs(p.y-c.y)<34&&Math.hypot(p.x-c.x,p.y-c.y)<26){damagePed(p,999,'p');c.spd*=.94;shake=Math.max(shake,3);sfx('hit',0);}}
    if(Math.abs(c.spd)>3&&Math.random()<.2)alertCivs(c.x,c.y,160);
  }
  P.x=c.x;P.y=c.y;
}
function updCars(dt,k){
  for(const c of cars){
    if(c.kind==='ai'){updAI(c,dt,k);for(const o of cars){if(o!==c&&o.kind==='player')carCar(o,c);}}
    else if(c.kind==='parked'){
      if(Math.abs(c.spd)>.05){c.x+=Math.cos(c.a)*c.spd*k;c.y+=Math.sin(c.a)*c.spd*k;c.spd*=Math.pow(.94,k);carWorld(c);c.rolling=true;}else{c.spd=0;c.rolling=false;}
    }else if(c.kind==='wreck'){c.wt+=dt;if(c.wt<30&&Math.random()<.5)fx(c.x+rand(-10,10),c.y+rand(-6,6),1,c.wt<10?'#ff7a20':'#444',.8,.9,c.wt<10?5:7,-.1);}
    if(c.kind!=='wreck'){
      if(c.hp<40&&c.hp>0&&Math.random()<.18)fx(c.x+Math.cos(c.a)*18,c.y+Math.sin(c.a)*18,1,'#777',.7,.8,5);
      if(c.hp<=0)explodeCar(c);
    }
  }
  cars=cars.filter(c=>!c.rm);
}

/* ================= PEDS ================= */
function updPeds(dt,k){
  for(const p of peds){
    if(p.dead){p.dt+=dt;if(p.dt>25)p.rm=true;continue;}
    const dxp=P.x-p.x,dyp=P.y-p.y,d=Math.hypot(dxp,dyp);
    if(p.type==='civ'){
      p.t-=dt;
      const sp=p.flee>0?2.7:.75;
      if(p.flee>0){p.flee-=dt;p.a=Math.atan2(p.y-p.fy,p.x-p.fx)+Math.sin(gt*3+p.seed)*.5;}
      else if(p.t<=0){p.a+=rand(-1.3,1.3);p.t=rand(1.5,4);p.idle=Math.random()<.25?rand(.6,2):0;}
      if(p.idle>0)p.idle-=dt;else{p.x+=Math.cos(p.a)*sp*k;p.y+=Math.sin(p.a)*sp*k;p.step+=sp*k*.25;}
      if(hitWorld(p,8))p.a+=Math.PI*.6+rand(-.5,.5);
    }else if(p.type==='npc'){
      if(d<200&&state==='play')p.a+=angDiff(p.a,Math.atan2(dyp,dxp))*Math.min(1,6*dt);
    }else{ // cop or gang
      if(p.type==='gang'&&d<p.det&&state==='play')p.alert=true;
      const hunting=(p.type==='cop')?wanted>0:p.alert;
      if(p.type==='cop'&&wanted===0){p.leave+=dt;p.a+=Math.sin(gt+p.seed)*.02;p.x+=Math.cos(p.a)*1.4*k;p.y+=Math.sin(p.a)*1.4*k;if(p.leave>9||d>1400)p.rm=true;}
      else if(hunting&&state==='play'){
        const want=Math.atan2(dyp,dxp);p.a+=angDiff(p.a,want)*Math.min(1,9*dt);
        const keep=p.type==='cop'?170:210;
        if(d>keep){p.x+=Math.cos(p.a)*2.35*k;p.y+=Math.sin(p.a)*2.35*k;p.step+=.6*k;}
        else{p.x+=Math.cos(p.a+Math.PI/2*p.sd)*.9*k;p.y+=Math.sin(p.a+Math.PI/2*p.sd)*.9*k;p.step+=.3*k;if(Math.random()<.005)p.sd*=-1;}
        p.fire-=dt;
        if(p.fire<=0&&d<470){enemyShoot(p,P.x,P.y);p.fire=rand(.7,1.5);}
      }
      if(hitWorld(p,9)&&Math.random()<.04)p.sd*=-1;
    }
    // push out of cars
    if(p.type!=='npc'||true){for(const c of cars){if(Math.abs(c.x-p.x)>40||Math.abs(c.y-p.y)>40)continue;for(const cc of carCircles(c))pushCircle(p,8,cc[0],cc[1],13);}}
  }
  // despawn far civilians / corpses
  for(const p of peds){if(p.type==='npc'||p.m)continue;if(Math.hypot(p.x-F.x,p.y-F.y)>1500)p.rm=true;}
  peds=peds.filter(p=>!p.rm);
}

function ringPoint(a,b){const t=rand(0,TAU),r=rand(a,b);return{x:F.x+Math.cos(t)*r,y:F.y+Math.sin(t)*r};}
function sidewalkNear(a,b){
  for(let n=0;n<12;n++){const q=ringPoint(a,b);if(q.x<120||q.y<120||q.x>WORLD-120||q.y>WORLD-120)continue;
    const i=clamp(Math.floor((q.x-ROAD)/CELL),0,N-1),j=clamp(Math.floor((q.y-ROAD)/CELL),0,N-1);
    const p=sw(i,j,(Math.random()*4)|0,rand(.08,.92)),d=Math.hypot(p.x-F.x,p.y-F.y);
    if(d>a*.85&&d<b*1.3)return p;}
  return null;}
function spawnTraffic(minD){
  for(let n=0;n<10;n++){
    const dir=(Math.random()*4)|0,line=(Math.random()*(N+1))|0,cl=rc(line);let x,y;
    const t=rand(0,WORLD);
    if(dir===0){x=t;y=cl+LANE;}else if(dir===2){x=t;y=cl-LANE;}else if(dir===1){y=t;x=cl-LANE;}else{y=t;x=cl+LANE;}
    const d=Math.hypot(x-F.x,y-F.y);if(d<(minD||700)||d>1250||x<60||y<60||x>WORLD-60||y>WORLD-60)continue;

  }

    if(m>.12){const a=Math.atan2(dy,dx);I.mx=Math.cos(a)*m;I.my=Math.sin(a)*m;I.sm=m;I.sa=a;I.tdrive=true;}}

  if(!SET.assist)return P.moveA!=null?P.moveA:P.a;

  for(const p of peds){if(p.dead||(p.type!=='gang'&&p.type!=='cop'))continue;const d=Math.hypot(p.x-P.x,p.y-P.y);if(d<bd){bd=d;best=p;}}
  if(M.tcar&&M.tcar.kind!=='wreck'){const d=Math.hypot(M.tcar.x-P.x,M.tcar.y-P.y);if(d<bd){bd=d;best=M.tcar;}}
  if(best)return Math.atan2(best.y-P.y,best.x-P.x);
  return P.moveA!=null?P.moveA:P.a;
}

const STN=[{n:'Neon FM',ch:[[57,[0,3,7]],[53,[0,4,7]],[48,[0,4,7]],[55,[0,4,7]]],t:.136},{n:'Wave 86',ch:[[50,[0,3,7]],[46,[0,4,7]],[53,[0,4,7]],[48,[0,4,7]]],t:.112},{n:'Radio off'}];
let radioSt=0,rT=0,rS=0;
const mf=m=>440*Math.pow(2,(m-69)/12);
function cycleRadio(d){radioSt=((radioSt+(d||1))%3+3)%3;rS=0;toast('♪ '+STN[radioSt].n,'#27e6e0');}
function radioTick(dt){
  const sn=STN[radioSt];if(!sn.ch||!P.car||muted||!AC||state!=='play')return;
  rT+=dt;if(rT>.5)rT=.5;
  while(rT>=sn.t){rT-=sn.t;const ch=sn.ch[((rS/16)|0)%4],r=ch[0],iv=ch[1],st=rS%16;
    if(st%4===0){tone(mf(r-12),.2,radioSt?'square':'sawtooth',.03);tone(95,.1,'sine',.07,-60);}
    if(st%8===4)noise(.08,.04,3000);
    if(st%2===1)noise(.03,.015,7000);
    const n=[0,1,2,1,0,1,2,1,2,1,0,1,2,1,0,1][st];tone(mf(r+12+iv[n%3]+(st%8>3?12:0)),.12,'square',.012);
    rS++;}
}
function enterCar(c){
  P.jz=0;P.jv=0;if(radioSt!==2)toast('♪ '+STN[radioSt].n+'  (R to change)','#27e6e0');
  if(c.kind==='ai'){const s=c.a+Math.PI/2,d=mkPed(c.x+Math.cos(s)*32,c.y+Math.sin(s)*32,'civ');d.flee=7;d.fx=c.x;d.fy=c.y;crime(.35);}

function exitCar(){
  const c=P.car;if(!c)return;
  if(Math.abs(c.spd)>3){toast('Slow down first','#ff3d5a');return;}
  for(const sd of[1,-1,0]){const a=sd===0?c.a+Math.PI:c.a+sd*Math.PI/2,d=sd===0?36:32,x=c.x+Math.cos(a)*d,y=c.y+Math.sin(a)*d;
    if(!blockedAt(x,y,9)){P.x=x;P.y=y;break;}P.x=x;P.y=y;}
  hitWorld(P,9);c.kind='parked';P.car=null;sfx('door');
}
function computeAction(){
  if(P.car){if(Math.hypot(P.x-GARAGE_GOAL.x,P.y-GARAGE_GOAL.y)<105&&Math.abs(P.car.spd)<2.6&&!P.car.tgt)return{t:'TUNE',f:openCustom};return{t:'EXIT',f:exitCar};}
  for(const g of GIV)if(Math.hypot(g.ped.x-P.x,g.ped.y-P.y)<66)return{t:'TALK',f:()=>talk(g)};
  if(Math.hypot(DOOR.ammu.x-P.x,DOOR.ammu.y-P.y)<64)return{t:'SHOP',f:openShop};
  if(Math.hypot(DOOR.hospital.x-P.x,DOOR.hospital.y-P.y)<64)return{t:'HEAL',f:openHeal};
  if(Math.hypot(DOOR.ward.x-P.x,DOOR.ward.y-P.y)<64)return{t:'STYLE',f:openAvatar};
  let bc=null,bd=62;for(const c of cars){if(c.kind==='wreck'||c.locked)continue;const d=Math.hypot(c.x-P.x,c.y-P.y);if(d<bd){bd=d;bc=c;}}
  if(bc)return{t:'ENTER',f:()=>enterCar(bc)};

}
function updPlayerFoot(I,dt,k){
  let mx=I.mx,my=I.my;const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m;}
  P.jz=P.jz||0;P.jv=P.jv||0;
  if(I.hb&&P.jz<=0&&P.jv<=0)P.jv=3.6;
  if(P.jz>0||P.jv>0){P.jz+=P.jv*k;P.jv-=.22*k;if(P.jz<=0){P.jz=0;P.jv=0;}}
  const sp=(I.sprint?3.6:2.5)*k;
  P.x+=mx*sp;P.y+=my*sp;P.step+=m*sp*.2;P.moving=m>.12;
  if(m>.12)P.moveA=Math.atan2(my,mx);
  hitWorld(P,9);
  for(const c of cars){if(Math.abs(c.x-P.x)>40||Math.abs(c.y-P.y)>40)continue;for(const cc of carCircles(c))pushCircle(P,9,cc[0],cc[1],13);}
  for(const g of GIV)pushCircle(P,9,g.ped.x,g.ped.y,8);
}
function updPlayer(I,dt,k){
  P.cd=Math.max(0,P.cd-dt);P.hurt=Math.max(0,P.hurt-dt);
  const aim=aimAngle();
  if(P.car)updPlayerCar(I,dt,k);
  else{updPlayerFoot(I,dt,k);
    if(!isTouch)P.a=aim;else{const t=I.fire?aim:(P.moveA!=null?P.moveA:P.a);P.a+=angDiff(P.a,t)*Math.min(1,14*dt);}}
  if(P.car)P.a=aim;
  // shooting
  if(I.fire&&P.cd<=0){
    if(P.ammo[P.w]>0){const w=WEAP[P.w];P.ammo[P.w]--;P.cd=w.rate;fireWeapon(P,aim,w,'p');alertCivs(P.x,P.y,450);heatQuiet=Math.min(heatQuiet,6);
      if(P.ammo[P.w]===0){for(let i=0;i<3;i++)if(P.has[i]&&P.ammo[i]>0){P.w=i;break;}}}
    else{P.cd=.3;sfx('click');}
  }
  // pickups
  for(const u of pickups){
    if(u.cd>0){u.cd-=dt;continue;}
    if(Math.hypot(u.x-P.x,u.y-P.y)<26){
      let took=true;
      if(u.type==='cash'){P.money+=u.v;toast('+$'+u.v,'#3ddc84');}
      else if(u.type==='hp'){if(P.hp>=100)took=false;else{P.hp=Math.min(100,P.hp+40);toast('+40 health','#ff7a8a');}}
      else if(u.type==='ammo'){P.ammo[0]+=14;if(P.has[1])P.ammo[1]+=30;if(P.has[2])P.ammo[2]+=8;toast('Ammo','#ffd37a');}
      else if(u.type==='w1'){P.has[1]=true;P.ammo[1]+=60;toast('SMG +60','#ffd37a');}
      else if(u.type==='w2'){P.has[2]=true;P.ammo[2]+=16;toast('Shotgun +16','#ffd37a');}
      if(took){sfx('pick');u.cd=u.drop?999999:70;if(u.drop)u.gone=true;}
    }
  }
  pickups=pickups.filter(u=>!u.gone);
  // interact
  if(edge.act){edge.act=false;const a=computeAction();if(a)a.f();}
}

function simWorld(dt){
  const k=dt*60;
  updCars(dt,k);updPeds(dt,k);updBullets(dt,k);
  for(const p of parts){p.x+=p.vx*k;p.y+=p.vy*k;p.vx*=.96;p.vy*=.96;p.z+=p.vz*k;if(p.g===0){p.vz-=.12*k;if(p.z<1){p.z=1;p.vz*=-.3;}}p.l-=dt;p.r+=(p.g!==0?.05:0)*k;}
  parts=parts.filter(p=>p.l>0);
  // population
  spawnCarT-=dt;if(spawnCarT<=0){spawnCarT=.7;const n=cars.filter(c=>c.kind==='ai'&&!c.tgt).length;if(n<16)spawnTraffic();}
  for(const c of cars){if(c.kind==='ai'&&!c.tgt&&Math.hypot(c.x-F.x,c.y-F.y)>1500)c.rm=true;
    if(c.kind==='wreck'&&c.wt>40&&Math.hypot(c.x-F.x,c.y-F.y)>500)c.rm=true;}
  spawnPedT-=dt;if(spawnPedT<=0){spawnPedT=.35;const n=peds.filter(p=>p.type==='civ'&&!p.dead).length;if(n<42){const q=sidewalkNear(650,1100);if(q)mkPed(q.x,q.y,'civ');}}
  shake=Math.max(0,shake-dt*22);
  for(const t of toasts)t.t-=dt;toasts=toasts.filter(t=>t.t>0);
  if(banners[0])banners[0].t-=dt;banners=banners.filter(b=>b.t>0);
}

function beam(mb,x,z,r,h,col,a,seg){

  for(const p of peds)if(p.type==='gang'&&!p.dead&&p.m)dot(p.x,p.y,'#ff3d5a',3.5);
  if(!M.active&&MIS[M.idx]){const gv=GIV[MIS[M.idx].g];dot(gv.ped.x,gv.ped.y,gv.col,7);lab(gv.name+' !',gv.ped.x,gv.ped.y-16*u,gv.col);}
  const t=M.target;if(t&&!t.giver){dot(t.x,t.y,t.car?'#ff3d5a':'#ffd04a',7);if(t.ring){g.strokeStyle='rgba(255,61,90,.7)';g.lineWidth=2*u;g.beginPath();g.arc(t.x,t.y,t.ring,0,TAU);g.stroke();}}
  g.save();g.translate(P.x,P.y);g.rotate(P.car?P.car.a:P.a);g.scale(u,u);g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=2;g.beginPath();g.moveTo(13,0);g.lineTo(-8,-9);g.lineTo(-4,0);g.lineTo(-8,9);g.closePath();g.fill();g.stroke();g.restore();
  g.restore();
  g.font='400 18px "Russo One",Impact,sans-serif';g.textAlign='left';g.textBaseline='top';g.lineWidth=4;g.strokeStyle='rgba(0,0,0,.7)';g.strokeText('PORT CITY',12,10);g.fillStyle='#ff4fa8';g.fillText('PORT CITY',12,10);
}
const AV_SKIN=SKIN,AV_SHIRT=SHIRT.concat(['#ffffff','#1b1b22']),AV_PANTS=['#243567','#1b1b22','#6b4a2f','#a0a7b3','#7a1d2b','#2f6b4a','#e8e1cf'],AV_HAIR=[null,'#2a1d12','#0d0d10','#7a4a2d','#d9b45a','#c4442b','#ff4fa8','#27e6e0'];
function openAvatar(){if(avOpen||mapOpen)return;if(!dlgOpen&&!setOpen)prevState=state;avOpen=true;state='dialog';renderAvatar();$('av').classList.remove('hide');}
function closeAvatar(){if(!avOpen)return;avOpen=false;$('av').classList.add('hide');saveAv();if(state==='dialog')state=prevState==='menu'?'menu':'play';}
function drawAvPrev(){
  const c=$('avpv');if(!c)return;const g=c.getContext('2d');g.clearRect(0,0,140,180);
  const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(70,170,34,6,0,0,TAU);g.fill();
  R(52,118,16,46,AV.pants);R(72,118,16,46,AV.pants);R(50,162,19,7,'#1a1a1f');R(71,162,19,7,'#1a1a1f');
  R(34,64,12,46,AV.shirt);R(94,64,12,46,AV.shirt);R(46,62,48,60,AV.shirt);
  g.fillStyle='#ff9ad0';[[56,76],[80,92],[66,106],[86,72]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],3,0,TAU);g.fill();});
  g.fillStyle=AV.skin;g.beginPath();g.arc(40,114,6,0,TAU);g.fill();g.beginPath();g.arc(100,114,6,0,TAU);g.fill();
  R(62,54,16,10,AV.skin);R(54,22,32,36,AV.skin);
  if(AV.hair){R(52,16,36,12,AV.hair);R(52,16,5,26,AV.hair);R(83,16,5,26,AV.hair);}
  if(AV.hat===1){R(52,12,36,14,AV.hatc);R(52,24,44,5,darken(AV.hatc,-50));}
  else if(AV.hat===2){R(52,8,36,20,AV.hatc);R(66,3,8,6,darken(AV.hatc,-50));}
  if(AV.shades)R(56,36,28,7,'#111');else{R(61,38,4,4,'#222');R(75,38,4,4,'#222');}
  R(64,49,12,2,'#a0403a');
}
function renderAvatar(){
  const sw=(a,v,on)=>'<button class="sw'+(on?' on':'')+'" style="background:'+(v||'#222')+'" data-a="'+a+'" data-v="'+(v||'')+'">'+(v?'':'&times;')+'</button>';
  const sec=(t,h)=>'<div class="sec">'+t+'</div>'+h;
  let h='<div class="ttl">AVATAR</div><canvas id="avpv" width="140" height="180"></canvas>';
  h+=sec('Skin','<div class="sws">'+AV_SKIN.map(c=>sw('skin',c,AV.skin===c)).join('')+'</div>');
  h+=sec('Shirt','<div class="sws">'+AV_SHIRT.map(c=>sw('shirt',c,AV.shirt===c)).join('')+'</div>');
  h+=sec('Pants','<div class="sws">'+AV_PANTS.map(c=>sw('pants',c,AV.pants===c)).join('')+'</div>');
  h+=sec('Hair <small>(&times; = bald)</small>','<div class="sws">'+AV_HAIR.map(c=>sw('hair',c,(AV.hair||null)===c)).join('')+'</div>');
  h+=sec('Headwear ','<div class="ops">'+opt('hat','0','None',AV.hat===0)+opt('hat','1','Cap',AV.hat===1)+opt('hat','2','Beanie',AV.hat===2)+'</div>');
  if(AV.hat>0)h+=sec('Headwear color','<div class="sws">'+SHIRT.map(c=>sw('hatc',c,AV.hatc===c)).join('')+'</div>');
  h+=sec('Sunglasses','<div class="ops">'+opt('shades','1','On',AV.shades)+opt('shades','0','Off',!AV.shades)+'</div>');
  h+='<div class="foot2"><span></span><button class="opt done" data-a="close">Done</button></div>';
  $('av').innerHTML=h;drawAvPrev();
}
$('av').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;audioInit();sfx('click');const a=b.dataset.a,v=b.dataset.v;
  if(a==='close'){closeAvatar();return;}
  if(a==='hair')AV.hair=v||null;else if(a==='hat')AV.hat=+v;else if(a==='shades')AV.shades=v==='1';else AV[a]=v;
  saveAv();renderAvatar();
});

(function(){
  const standalone=matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  let fsTried=false;
  function goFull(){
    if(fsTried||standalone||!isTouch)return;fsTried=true;
    try{const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(f){const r=f.call(el);const lock=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(e){}};if(r&&r.then)r.then(lock).catch(()=>{});else lock();}}catch(e){}
  }
  addEventListener('touchend',goFull,{once:false,passive:true});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('gesturestart',e=>e.preventDefault());
  let wl=null;
  async function wake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible'&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}}catch(e){}}
  addEventListener('touchstart',wake,{passive:true});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(state==='play'){save();pauseGame();}}else wake();
  });
  addEventListener('pagehide',()=>{if(state==='play'||state==='dialog')save();});
})();


/* ================= ADS (AdMob, Android app only) ================= */
const ADS={
  test:true, // set to false once you paste your real AdMob unit IDs below
  interstitial:'ca-app-pub-3940256099942544/1033173712',
  rewarded:'ca-app-pub-3940256099942544/5224354917',
  gap:180000, // minimum ms between interstitials
  reward:300  // cash for watching a rewarded ad
};
let adLast=Date.now(),adReady=false,adRewardReady=false,adErr='',adInited=false,adRTries=0,adITries=0;
const adMsg=e=>String((e&&(e.message||e.errorMessage||e.code))||e||'unknown').slice(0,70);
const AdM=(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins)?Capacitor.Plugins.AdMob:null;
async function adInit(){
  if(!AdM)return;
  try{
    await AdM.initialize({initializeForTesting:ADS.test});
    adInited=true;
    adPrepare();adPrepareReward();
  }catch(e){adErr='init: '+adMsg(e);setTimeout(adInit,15000);}
}
async function adPrepare(){try{await AdM.prepareInterstitial({adId:ADS.interstitial,isTesting:ADS.test});adReady=true;adITries=0;}catch(e){adReady=false;adErr='interstitial: '+adMsg(e);if(adITries++<8)setTimeout(adPrepare,15000);}}
async function adPrepareReward(){try{await AdM.prepareRewardVideoAd({adId:ADS.rewarded,isTesting:ADS.test});adRewardReady=true;adRTries=0;}catch(e){adRewardReady=false;adErr='rewarded: '+adMsg(e);if(adRTries++<8)setTimeout(adPrepareReward,15000);}}
async function adBreak(){
  if(!AdM||!adReady||Date.now()-adLast<ADS.gap)return;
  adLast=Date.now();adReady=false;
  try{save();await AdM.showInterstitial();}catch(e){}
  adPrepare();
}
async function adReward(){
  if(!AdM)return;
  if(!adRewardReady){toast(adInited?('Ad loading... '+(adErr||'try again in a few seconds')):('Ads starting... '+(adErr||'wait a moment')),'#ff3d5a');if(adInited)adPrepareReward();return;}
  adRewardReady=false;
  try{
    const r=await AdM.showRewardVideoAd();
    if(r){P.money+=ADS.reward;save();toast('+$'+ADS.reward+' thanks for watching!','#3ddc84');sfx('pick');}
  }catch(e){adErr='show: '+adMsg(e);toast('Ad error: '+adMsg(e),'#ff3d5a');}
  adPrepareReward();
}
setTimeout(adInit,1500);
